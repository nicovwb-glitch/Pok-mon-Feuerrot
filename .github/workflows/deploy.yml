name: App auf GitHub Pages veröffentlichen

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: App bauen
        run: npm run build

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v6

      - name: App hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: App veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5